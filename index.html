<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>:root{--navy:#17365d;--teal:#168477;--gold:#f5b914;--bg:#fff8e8;--card:#fff;--ink:#1d2a3a;--mut:#6b7a8c;--ok:#2e9e5b;--bad:#e5484d;--r:22px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:"Noto Sans Bengali","Kalpurush","SolaimanLipi","Nirmala UI",system-ui,sans-serif;background:linear-gradient(180deg,#e6f5ff 0,#fff8e8 260px,#fff8e8 100%);background-attachment:fixed;color:var(--ink);font-size:17px;line-height:1.45;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;border:0;cursor:pointer}
#app{max-width:540px;margin:0 auto;padding:0 14px 40px;min-height:100vh}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:10px 0;background:linear-gradient(180deg,#e6f5ff 70%,rgba(230,245,255,0))}
.top h1{flex:1;margin:0;font-size:19px;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:44px;height:44px;border-radius:50%;background:#fff;box-shadow:0 2px 6px #0002;font-size:21px;display:grid;place-items:center;flex:none}
.chip{background:var(--navy);color:#fff;border-radius:99px;padding:6px 12px;font-weight:700;font-size:15px;white-space:nowrap}
.chip.g{background:var(--gold);color:#4a3600}
.tutor{display:flex;gap:10px;align-items:flex-start;margin:6px 0 14px}
.bird{font-size:44px;line-height:1;flex:none;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.bub{flex:1;background:#fff;border-radius:6px 20px 20px 20px;padding:11px 14px;box-shadow:0 2px 8px #0002;font-size:18px;font-weight:600;color:var(--navy);min-height:48px}
.bub small{display:block;font-weight:400;color:var(--mut);font-size:13px;margin-top:2px}
.say{flex:none;width:44px;height:44px;border-radius:50%;background:var(--teal);color:#fff;font-size:20px;box-shadow:0 2px 6px #0003}
.hero{text-align:center;padding:18px 6px 6px}
.hero img{width:88px;height:88px;border-radius:50%;box-shadow:0 3px 10px #0003}
.hero h2{margin:8px 0 2px;color:var(--navy);font-size:26px}
.hero p{margin:0;color:var(--mut)}
.kids{display:grid;gap:14px;margin:18px 0}
.kid{display:flex;align-items:center;gap:14px;background:#fff;border-radius:var(--r);padding:14px 16px;box-shadow:0 3px 10px #0002;text-align:left;width:100%;border:3px solid transparent}
.kid:active{transform:scale(.98)}
.kid .av{font-size:54px;line-height:1;width:72px;height:72px;border-radius:50%;display:grid;place-items:center;flex:none}
.kid b{font-size:24px;color:var(--navy);display:block}
.kid span{color:var(--mut);font-size:14px}
.kid .st{margin-left:auto;text-align:right;font-weight:700;color:#b07d00;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:10px 0}
.tile{background:#fff;border-radius:var(--r);padding:14px 8px;text-align:center;box-shadow:0 3px 8px #0002;font-weight:700;color:var(--navy);font-size:17px;border-bottom:5px solid var(--c,#ccc);min-height:104px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.tile:active{transform:scale(.96)}
.tile i{font-style:normal;font-size:40px;line-height:1.1}
.tile small{font-weight:400;color:var(--mut);font-size:12px}
h3{margin:18px 2px 6px;color:var(--navy);font-size:18px}
.card{background:#fff;border-radius:var(--r);padding:16px;box-shadow:0 2px 8px #0002;margin:10px 0}
.card.c{text-align:center}
.tabs{display:flex;gap:8px;margin:6px 0 10px;flex-wrap:wrap}
.tab{padding:8px 14px;border-radius:99px;background:#fff;box-shadow:0 1px 4px #0002;font-weight:700;color:var(--navy);font-size:15px}
.tab.on{background:var(--navy);color:#fff}
.bar{height:12px;border-radius:9px;background:#dde7f0;overflow:hidden;margin:6px 0 12px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--gold));border-radius:9px;transition:width .3s}
.q{text-align:center;padding:10px 4px}
.q .big{font-size:84px;line-height:1.1;margin:4px 0}
.q .txt{font-size:30px;font-weight:800;color:var(--navy);line-height:1.35;word-break:break-word}
.q .sub{font-size:15px;color:var(--mut)}
.q svg{max-width:200px;height:auto}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.opt{background:#fff;border-radius:18px;padding:16px 8px;font-size:26px;font-weight:800;color:var(--navy);box-shadow:0 3px 8px #0002;border:3px solid #fff;min-height:68px;word-break:break-word}
.opt.sm{font-size:19px}
.opt:active{transform:scale(.97)}
.opt.ok{background:#d9f7e4;border-color:var(--ok)}
.opt.no{background:#ffe0e1;border-color:var(--bad);animation:shk .35s}
@keyframes shk{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.ans{min-height:64px;margin:8px auto;max-width:260px;border-radius:16px;background:#fff;border:3px dashed #9db3c8;font-size:36px;font-weight:800;color:var(--navy);display:grid;place-items:center}
.ans.ok{border-color:var(--ok);background:#d9f7e4}.ans.no{border-color:var(--bad);animation:shk .35s}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;max-width:320px;margin:8px auto}
.kp button{height:56px;border-radius:14px;background:#fff;box-shadow:0 2px 5px #0003;font-size:26px;font-weight:800;color:var(--navy)}
.kp button.go{background:var(--ok);color:#fff}.kp button.del{background:#ffe9c7}
.btn{text-decoration:none;display:block;width:100%;padding:14px;border-radius:16px;background:var(--navy);color:#fff;font-weight:800;font-size:18px;box-shadow:0 3px 8px #0003;margin:10px 0;text-align:center}
.btn.g{background:var(--ok)}.btn.o{background:#ff8a3d}.btn.w{background:#fff;color:var(--navy)}.btn.r{background:var(--bad)}.btn.s{padding:9px 14px;font-size:15px;display:inline-block;width:auto;margin:4px 4px 4px 0}
.row{display:flex;gap:10px;align-items:center}
.row>*{flex:1}
.deck{text-align:center;padding:20px 10px}
.deck .sym{font-size:130px;line-height:1.15;font-weight:800;color:var(--navy)}
.deck .sym.t{font-size:96px}
.deck .em{font-size:76px}
.deck .nm{font-size:30px;font-weight:800;color:var(--teal)}
.deck .en{font-size:20px;color:var(--mut)}
.dot{display:inline-block;width:120px;height:120px;border-radius:50%;box-shadow:inset 0 -8px 0 #0002,0 3px 8px #0003}
.pager{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pager .ib{width:56px;height:56px;font-size:26px}
.strip{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0}
.strip button{min-width:42px;height:42px;border-radius:12px;background:#fff;box-shadow:0 1px 4px #0003;font-weight:800;font-size:19px;color:var(--navy)}
.strip button.on{background:var(--gold)}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.1;margin:0 2px}
.fr b{border-bottom:3px solid currentColor;padding:0 4px}.fr i{font-style:normal;padding:0 4px}
.blocks{font-size:34px;letter-spacing:2px;line-height:1.3}
canvas#tr{width:100%;aspect-ratio:1;background:#fff;border-radius:var(--r);box-shadow:0 2px 8px #0003;touch-action:none;display:block}
.line{padding:10px 12px;border-radius:14px;font-size:24px;font-weight:700;color:var(--navy);margin:6px 0;background:#fff;box-shadow:0 1px 4px #0002;text-align:left}
.line.on{background:#fff3c4;outline:3px solid var(--gold)}
.line.ok{background:#d9f7e4}
.mod{position:fixed;inset:0;background:#0007;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.mod>div{background:#fff;width:100%;max-width:540px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 16px 26px}
.mod h3{margin-top:2px}
.fld{display:block;margin:10px 0}
.fld span{display:block;font-size:14px;color:var(--mut);margin-bottom:3px}
input,select,textarea{font:inherit;width:100%;padding:11px 12px;border-radius:12px;border:2px solid #c9d6e2;background:#fff;color:var(--ink);user-select:text;-webkit-user-select:text}
.pin{display:flex;gap:12px;justify-content:center;margin:12px 0}
.pin i{width:18px;height:18px;border-radius:50%;border:3px solid var(--navy)}.pin i.f{background:var(--navy)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 18px;border-radius:99px;z-index:30;font-weight:700;max-width:90vw;text-align:center}
.pop{position:fixed;inset:0;z-index:25;pointer-events:none;display:grid;place-items:center;font-size:90px;animation:pop 1.1s ease-out forwards}
@keyframes pop{0%{transform:scale(.3);opacity:0}30%{transform:scale(1.2);opacity:1}100%{transform:scale(1) translateY(-60px);opacity:0}}
.warn{background:#fff3cd;border-radius:16px;padding:12px 14px;margin:10px 0;font-size:15px;color:#6b4e00}
.note{color:var(--mut);font-size:13px;margin:6px 2px}
.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl td,.tbl th{padding:6px 4px;border-bottom:1px solid #e3ebf2;text-align:left}
.pb{height:9px;border-radius:6px;background:#e3ebf2;overflow:hidden;min-width:60px}.pb>i{display:block;height:100%;background:var(--ok)}.pb.lo>i{background:var(--bad)}.pb.mid>i{background:var(--gold)}
.days{display:flex;align-items:flex-end;gap:4px;height:70px;margin:8px 0}
.days i{flex:1;background:var(--teal);border-radius:4px 4px 0 0;min-height:2px}
.stk{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stk button{background:#fff;border-radius:16px;padding:8px 2px;font-size:38px;box-shadow:0 1px 4px #0002;line-height:1.2}
.stk button small{display:block;font-size:12px;color:var(--mut)}
.stk button.lock{filter:grayscale(1);opacity:.45}
.baby{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.baby button{background:#fff;border-radius:28px;padding:18px 6px;font-size:84px;line-height:1.1;box-shadow:0 4px 10px #0003}
.baby button small{display:block;font-size:20px;font-weight:800;color:var(--navy)}
.bal{position:fixed;font-size:64px;z-index:9;animation:up 5s linear forwards;cursor:pointer}
@keyframes up{from{transform:translateY(0)}to{transform:translateY(-120vh)}}
.hide{display:none!important}
.rest{text-align:center;padding:60px 10px}
.rest .bird{font-size:90px}
@media (max-width:360px){.opt{font-size:22px}.deck .sym{font-size:104px}}
@media print{.top,.btn,.ib{display:none}}
</style></head>
<body><div id="app"></div>
<script>
/* ===== CONTENT BANKS (all original wording; no textbook passages, no Quran verses, no copyrighted poems) ===== */

function makeQ(topic,kid){
  const st=statOf(kid,topic);const l=st.lvl||1;const cls=kid.cls||3;
  if(MG[topic])return MG[topic](l);
  const m4=MATH4.find(x=>x[0]==topic);if(m4)return Object.assign(MG[m4[3]](m4[4]==1?st.lvl||1:m4[4]==2?Math.min(3,2+(st.lvl>1?1:0)):3),{topic});
  if(SG[topic])return SG[topic](cls);
  if(PG[topic])return PG[topic](l);

 else h+='<p class="note">ক্লাস ৪-এর আগাম প্রস্তুতি — বিষয়ের তালিকা আনুমানিক, স্কুলের বইয়ের সাথে মিলিয়ে নিন।</p>';return h}

function deckOf(k){
 if(k=='vowel'||k=='cons'){const a=k=='vowel'?VOWELS:CONS;return{title:k=='vowel'?'স্বরবর্ণ':'ব্যঞ্জনবর্ণ',items:a.map(x=>({sym:x[0],em:x[2],nm:x[1],say:[{t:x[0]+'।'},{t:`${x[0]} দিয়ে ${x[1]}।`}]}))}}
 if(k=='num')return{title:'সংখ্যা',items:NUMW.map(x=>({sym:x[0],nm:x[1],em:+x[2]>0&&+x[2]<=10?'⭐'.repeat(+x[2]):'',say:[{t:x[1]}]}))};
 if(k=='abc')return{title:'English ABC',items:ABC.map(x=>({sym:x[0]+x[0].toLowerCase(),em:x[2],nm:x[1],en:x[3],say:[{t:`${x[0]}. ${x[0]} for ${x[1]}`,lang:'en'}]}))};
 if(k=='arb')return{title:'আরবি হরফ',items:ARB.map(x=>({sym:x[0],arab:1,nm:x[1],say:[{t:x[1]}]}))};
 if(DECKS[k]){const c=k=='color';return{title:TNAME[k]||k,items:DECKS[k].map(x=>({em:c?'':x[0],col:c?x[0]:'',nm:x[1],en:x[2],sub:x[3]?`${x[1]} বলে “${x[3]}”`:'',say:[{t:x[1]},{t:x[2],lang:'en'}].concat(x[3]?[{t:`${x[1]} বলে ${x[3]}`}]:[])}))}}
 if(k=='week'||k=='month'||k=='season'){const a=k=='week'?WEEK:k=='month'?MONTHS:SEASONS;return{title:k=='week'?'সপ্তাহের দিন':k=='month'?'বাংলা মাস':'ঋতু',items:a.map((x,i)=>({sym:x,t:1,nm:'ক্রম: '+bn(i+1),say:[{t:x}]}))}}
 if(k.startsWith('tab')){const n=+k.slice(3);return{title:`${bn(n)} এর নামতা`,items:Array.from({length:10},(_,i)=>({sym:`${bn(n)} × ${bn(i+1)} = ${bn(n*(i+1))}`,t:1,nm:'',say:[{t:`${nw(n)} গুণ ${nw(i+1)} সমান ${nw(n*(i+1))}`}]}))}}

async function hashPin(p){const s='pathshala:'+p;try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=5381;for(const c of s)h=((h<<5)+h+c.charCodeAt(0))>>>0;return'f'+h}}
